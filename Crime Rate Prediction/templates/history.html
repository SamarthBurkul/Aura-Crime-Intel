<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2 class="text-center mb-4">Crime Prediction History</h2>

<table class="table table-bordered table-striped">

<tr>
    <th>ID</th>
    <th>City</th>
    <th>Year</th>
    <th>Crime Rate</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
